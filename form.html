<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width-device-width, initial-scale=1.0">
    <title>Pet Co. Adopt Your Favorite Animal</title>
     <link rel="stylesheet" href="form.css">
</head>
<body>
  <div class="header">
    <h2> Want a pet? Get your dream pet from Pet Co</h2>
     <form>
      <div class="details">
      <div class="form-section">
        <label for="name">Full Name</label>
    <input type="text" id="name" for="name" placeholder="ogbodo paschal" required>
      </div>
      <div class="form-section">
        <label for="pets">Choose your new pal</label>
        <select id='pets' name="pets">
      <option value="dog">Puppy</option>
      <option value="cat">Kitten</option>
      <option value="bird">Parrot</option>
      <option value="reptil">Rock Pyton</option>
    </select>
      </div>
      <div class="form-section">
        <label for="form-survey">Why are you intrested in getting a pet?</label>
         <textarea id="form-survey" name="form-survey" placeholder="Tell us about your home and why you'd like a new friend.."></textarea>
      </div>
      <button> Get your pet</button>
  </div>
</body>
</html>
